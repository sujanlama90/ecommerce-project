<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        :root {
            --ink: #181A2E;
            --panel: #1B1F3B;
            --panel-2: #242A52;
            --cream: #F7F3EA;
            --amber: #E8A33D;
            --amber-soft: #F3C77E;
            --muted: #9098B8;
            --line: #34395E;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top left,
                    #2f6dbf 0%,
                    transparent 35%),
                radial-gradient(circle at bottom right,
                    #7039dd 0%,
                    transparent 35%),
                var(--ink);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .reset-wrapper {
            width: 100%;
            max-width: 470px;
        }

        .reset-card {
            background: rgba(27, 31, 59, 0.96);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 24px;

            padding: 42px 38px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);
        }

        /* Icon */
        .icon-box {
            width: 68px;
            height: 68px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: rgba(232, 163, 61, 0.12);

            color: var(--amber);

            font-size: 28px;
        }

        /* Heading */
        .reset-card h1 {
            color: var(--white);

            font-size: 30px;
            font-weight: 700;

            text-align: center;

            margin-bottom: 12px;
        }

        /* Description */
        .description {
            color: var(--muted);

            text-align: center;

            line-height: 1.6;

            font-size: 15px;

            margin-bottom: 30px;
        }

        /* Label */
        .form-label {
            color: #e8e9f2;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;
        }

        /* Input */
        .input-group {
            margin-bottom: 24px;
        }

        .input-group-text,
        .form-control {
            background: var(--panel-2);

            border-color: var(--line);

            color: var(--white);
        }

        .input-group-text {
            border-right: 0;

            color: var(--muted);

            padding-left: 15px;
        }

        .form-control {
            border-left: 0;

            padding: 13px 12px;

            box-shadow: none !important;
        }

        .form-control::placeholder {
            color: #737a9c;
        }

        .form-control:focus {
            background: var(--panel-2);

            color: var(--white);

            border-color: var(--amber);
        }

        .input-group:focus-within .input-group-text {
            border-color: var(--amber);

            color: var(--amber);
        }

        /* Buttons */
        .btn-reset {
            width: 100%;

            border: none;

            border-radius: 12px;

            padding: 13px;

            background: var(--amber);

            color: var(--ink);

            font-weight: 700;

            font-size: 15px;

            transition: 0.25s ease;
        }

        .btn-reset:hover {
            background: var(--amber-soft);

            transform: translateY(-1px);
        }

        .btn-back {
            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            margin-top: 14px;

            padding: 12px;

            border-radius: 12px;

            border: 1px solid var(--line);

            background: rgba(255, 255, 255, 0.03);

            color: var(--muted);

            font-weight: 600;

            font-size: 14px;

            text-decoration: none;

            transition: all 0.25s ease;
        }

        .btn-back:hover {
            background: var(--panel-2);

            border-color: rgba(232, 163, 61, 0.4);

            color: var(--white);

            transform: translateY(-1px);
        }

        /* Error */
        .error-message {
            color: #ff8f8f;

            font-size: 13px;

            margin-top: -12px;

            margin-bottom: 18px;
        }

        /* Mobile */
        @media (max-width: 480px) {

            .reset-card {
                padding: 32px 22px;

                border-radius: 20px;
            }

            .reset-card h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="reset-wrapper">

        <div class="reset-card">

            <!-- Icon -->
            <div class="icon-box">
                <i class="fa-solid fa-key"></i>
            </div>

            <!-- Heading -->
            <h1>Password reset</h1>

            <!-- Description -->
            <p class="description">
                Forgotten your password?
                Enter your email address below, and we'll email
                instructions for setting a new one.
            </p>

            <!-- Form -->
            <form method="POST">

                {% csrf_token %}

                <!-- Email -->
                <label for="id_email" class="form-label">
                    Email address
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="fa-solid fa-envelope"></i>
                    </span>

                    <input type="email" name="email" id="id_email" class="form-control"
                        placeholder="Enter your email address" autocomplete="email" required>

                </div>

                <!-- Django form errors -->
                {% if form.errors %}
                <div class="error-message">
                    {{ form.email.errors }}
                </div>
                {% endif %}

                <!-- Submit Button -->
                <button type="submit" class="btn-reset">
                    <i class="fa-solid fa-paper-plane me-2"></i>
                    Send Reset Link
                </button>

                <!-- Back Button -->
                <a href="{% url 'log_in' %}" class="btn-back">
                    <i class="fa-solid fa-arrow-left me-2"></i>
                    Back to Login
                </a>

            </form>

        </div>

    </div>

</body>

</html>
