<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset Complete</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        :root {
            --ink: #181A2E;
            --panel: #1B1F3B;
            --amber: #E8A33D;
            --amber-soft: #F3C77E;
            --muted: #9098B8;
            --white: #ffffff;
            --success: #67D391;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top left,
                    #292e58 0%,
                    transparent 35%),
                radial-gradient(circle at bottom right,
                    #332b43 0%,
                    transparent 35%),
                var(--ink);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .success-wrapper {
            width: 100%;
            max-width: 470px;
        }

        .success-card {
            background: rgba(27, 31, 59, 0.96);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 24px;

            padding: 45px 40px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);
        }

        /* Success icon */
        .success-icon {
            width: 82px;
            height: 82px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(103, 211, 145, 0.12);

            border: 1px solid rgba(103, 211, 145, 0.2);

            color: var(--success);

            font-size: 34px;

            box-shadow:
                0 0 0 8px rgba(103, 211, 145, 0.04);
        }

        /* Heading */
        .success-card h1 {
            color: var(--white);

            font-size: 29px;

            font-weight: 700;

            margin-bottom: 15px;
        }

        /* Message */
        .success-card p {
            color: var(--muted);

            font-size: 15px;

            line-height: 1.7;

            margin-bottom: 28px;
        }

        /* Success message box */
        .success-message {
            display: flex;

            align-items: center;

            gap: 12px;

            text-align: left;

            background: rgba(103, 211, 145, 0.06);

            border: 1px solid rgba(103, 211, 145, 0.12);

            border-radius: 13px;

            padding: 14px 16px;

            margin-bottom: 25px;
        }

        .success-message i {
            color: var(--success);

            font-size: 18px;
        }

        .success-message span {
            color: #c8ccda;

            font-size: 13px;

            line-height: 1.5;
        }

        /* Login button */
        .login-btn {
            display: block;

            width: 100%;

            padding: 13px;

            border-radius: 12px;

            background: var(--amber);

            color: var(--ink);

            text-decoration: none;

            font-size: 15px;

            font-weight: 700;

            transition: 0.25s ease;
        }

        .login-btn:hover {
            background: var(--amber-soft);

            color: var(--ink);

            transform: translateY(-1px);
        }

        /* Mobile */
        @media (max-width: 480px) {

            .success-card {
                padding: 35px 22px;

                border-radius: 20px;
            }

            .success-card h1 {
                font-size: 25px;
            }

            .success-icon {
                width: 72px;
                height: 72px;

                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <div class="success-wrapper">

        <div class="success-card">

            <!-- Success icon -->
            <div class="success-icon">
                <i class="fa-solid fa-check"></i>
            </div>

            <!-- Heading -->
            <h1>Password reset complete</h1>

            <!-- Description -->
            <p>
                Your password has been set successfully.
                You may now go ahead and log in to your account.
            </p>

            <!-- Success message -->
            <div class="success-message">

                <i class="fa-solid fa-shield-check"></i>

                <span>
                    Your account password has been updated.
                    You can now use your new password to sign in.
                </span>

            </div>

            <!-- Login -->
            <a href="{% url 'log_in' %}" class="login-btn">
                <i class="fa-solid fa-right-to-bracket me-2"></i>
                Log in
            </a>

        </div>

    </div>

</body>

</html>
